<!DOCTYPE html>
{% load static %}
<html class="dark" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Saathi{% endblock %}</title>

    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>

    <style type="text/tailwindcss">
        @tailwind base;
        @tailwind components;
        @tailwind utilities;

        html {
          scroll-behavior: smooth;
        }
    </style>

    <script>
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                primary: "#fe7474",
                "background-light": "#ffffff",
                "background-dark": "#0D0F14",
                "accent-1": "#c7b7ff",
                secondary: "#ffa8a8",
                "text-main": "#ffffff",
                "text-light": "#1f2937",
                "text-dark": "#ffffff",
                "tv-pink": "#fe7474",
                "tv-blue": "#c7b7ff",
              },
              fontFamily: {
                display: ["Space Grotesk", "sans-serif"],
              },
              borderRadius: {
                DEFAULT: "8px",
              },
            },
          },
        };
    </script>

    <style>
        body {
          font-family: 'Space Grotesk', sans-serif;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body class="bg-background-dark text-text-main">
    <header class="flex items-center justify-between whitespace-nowrap border-b border-white/10 px-10 py-5">
        <div class="flex items-center gap-4">
             <img src="{% static 'flower.png' %}" class="h-10 w-10" />
            <h2 class="text-xl font-bold leading-tight tracking-[-0.015em]">Saathi</h2>
        </div>

        <nav class="hidden lg:flex items-center gap-8 absolute left-1/2 transform -translate-x-1/2">
            <a class="text-white/70 hover:text-white transition-colors" href="{% url 'saathi:chat' %}">Chat</a>
            <a class="text-white/70 hover:text-white transition-colors" href="{% url 'saathi:quiz_gen' %}">Make a Quiz</a>
            <a class="text-white/70 hover:text-white transition-colors" href="{% url 'saathi:progress' %}">Progress</a>
            <a class="text-white/70 hover:text-white transition-colors" href="{% url 'saathi:take_quiz' %}">Take a Quiz</a>
        </nav>

        <div class="hidden md:flex items-center gap-6">
            <a class="text-white/70 hover:text-white transition-colors" href="{% url 'saathi:home' %}">Home</a>
            <a class="text-white/70 hover:text-white transition-colors" href="{% url 'saathi:contact' %}">Contact Us</a>
        </div>

        <div class="flex items-center gap-6 md:hidden">
            <button class="text-white/70 hover:text-white transition-colors">
                <span class="material-icons-outlined text-3xl">menu</span>
            </button>
        </div>
    </header>

    {% block content %}
    {% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
