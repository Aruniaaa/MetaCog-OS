{% extends 'navbar-saathi.html' %}
{% load static %}

{% block title %}Quizzes Await!{% endblock %}

{% block content %}

<main class="flex-grow flex items-center justify-center">
<section class="text-center py-16 md:py-20 px-4 sm:px-6 lg:px-8">
<div class="max-w-4xl mx-auto">
<div class="flex justify-center mb-8">
<div class="p-6 bg-gray-900/40 border border-gray-800 rounded-full">
<span class="material-icons-outlined text-accent-1 !text-5xl">quiz</span>
</div>
</div>
<h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-text-main mb-4">
                    Your Quizzes Await
                </h1>
<p class="text-lg text-gray-400">
                    It seems you haven't generated a quiz yet, or you've attempted them all.
                </p>
<div class="mt-12">
<a class="inline-block px-8 py-3 bg-primary text-background-dark font-bold rounded-DEFAULT shadow-lg hover:opacity-90 transition-opacity" href="{% url 'saathi:quiz_gen' %}">
                        Make a New Quiz
                    </a>
</div>
</div>
</section>
</main>
<footer class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 border-t border-gray-800">
<div class="flex flex-col sm:flex-row items-center justify-between">
<div class="flex items-center space-x-2">
<img src="{% static 'flower.png' %}" class="h-10 w-10" />
<span class="font-bold text-xl text-text-dark">Saathi</span>
</div>
<p class="text-gray-500 dark:text-gray-400 text-sm mt-4 sm:mt-0">
                © 2025 Saathi. All rights reserved.
            </p>
</div>
</footer>

{% endblock %}
