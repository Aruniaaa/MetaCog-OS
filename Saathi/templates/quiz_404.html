<!DOCTYPE html>
{% load static %}
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Saathi - Quiz</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#fe7474",
            "background-light": "#ffffff",
            "background-dark": "#0D0F14",
            "accent-1": "#c7b7ff",
            secondary: "#ffa8a8",
            "text-main": "#ffffff",
            "text-light": "#1f2937",
            "text-dark": "#ffffff"
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "8px",
          },
        },
      },
    };
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark antialiased">
<div class="flex flex-col min-h-screen">
<header class="w-full  px-4 sm:px-6 lg:px-8 py-6 ">
<nav class="flex items-center justify-between">
<a class="flex items-center space-x-2" href="{% url 'saathi:home' %}">
<img src="{% static 'flower.png' %}" class="h-10 w-10" />
<span class="font-bold text-xl text-text-light dark:text-text-dark">Saathi</span>
</a>
<div class="hidden md:flex items-center justify-center flex-1 space-x-6 ">
<a class="text-gray-300 hover:text-primary transition-colors" href="{% url 'saathi:chat' %}">Chat</a>
<a class="text-gray-300 hover:text-primary transition-colors" href="{% url 'saathi:progress' %}">Progress</a>
<a class="text-gray-300 hover:text-primary transition-colors" href="{% url 'saathi:quiz_gen' %}">Make a Quiz</a>
</div>
<div class="hidden md:flex items-center space-x-6">
<a class="text-gray-300 hover:text-primary transition-colors" href="{% url 'saathi:home' %}">Home</a>
<a class="text-gray-300 hover:text-primary transition-colors" href="{% url 'saathi:contact' %}">Contact Us</a>
</div>
<button class="md:hidden">
<span class="material-icons-outlined text-text-light dark:text-text-dark">menu</span>
</button>
</nav>
</header>
<main class="flex-grow flex items-center justify-center">
<section class="text-center py-16 md:py-20 px-4 sm:px-6 lg:px-8">
<div class="max-w-4xl mx-auto">
<div class="flex justify-center mb-8">
<div class="p-6 bg-gray-900/40 border border-gray-800 rounded-full">
<span class="material-icons-outlined text-accent-1 !text-5xl">quiz</span>
</div>
</div>
<h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-text-main mb-4">
                    Your Quizzes Await
                </h1>
<p class="text-lg text-gray-400">
                    It seems you haven't generated a quiz yet, or you've attempted them all.
                </p>
<div class="mt-12">
<a class="inline-block px-8 py-3 bg-primary text-background-dark font-bold rounded-DEFAULT shadow-lg hover:opacity-90 transition-opacity" href="{% url 'saathi:quiz_gen' %}">
                        Make a New Quiz
                    </a>
</div>
</div>
</section>
</main>
<footer class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 border-t border-gray-800">
<div class="flex flex-col sm:flex-row items-center justify-between">
<div class="flex items-center space-x-2">
<img src="{% static 'flower.png' %}" class="h-10 w-10" />
<span class="font-bold text-xl text-text-dark">Saathi</span>
</div>
<p class="text-gray-500 dark:text-gray-400 text-sm mt-4 sm:mt-0">
                © 2025 Saathi. All rights reserved.
            </p>
</div>
</footer>
</div>

</body></html>
