<!DOCTYPE html>
{% load static %}
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FocusAI Contact Us</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#fe7474", // Deep Neural Blue
            "secondary": "#ffa8a8", // Synapse Pink
            "accent-1": "#c7b7ff", // Midnight Indigo
            "background-dark": "#0D0F14", // Dark Cognitive Void
            "text-main": "#ffffff", // Cognitive Ink
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style type="text/tailwindcss">
    .material-symbols-outlined {
      font-variation-settings:
      'FILL' 0,
      'wght' 400,
      'GRAD' 0,
      'opsz' 24
    }
    .material-symbols-filled {
        font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
    }
    .icon-wrapper > svg {
        width: 1.75rem;height: 1.75rem;}
  </style>
</head>
<body class="bg-background-dark font-display text-text-main">
<div class="relative flex min-h-screen w-full flex-col">
<header class="flex items-center justify-between whitespace-nowrap border-b border-white/10 px-10 py-5">
<div class="flex items-center gap-4">
<div class="h-8 w-8 bg-gradient-to-br rounded-lg flex items-center justify-center">
<img src="{% static 'assets/vinca.png' %}" class="h-8 w-8" alt="vinca" />
</div>
<h2 class="text-xl font-bold leading-tight tracking-[-0.015em]">FocusAI</h2>
</div>
<nav class="hidden md:flex flex-1 items-center justify-center gap-6">
<a class="text-white/70 hover:text-white transition-colors" href="{% url 'focusai:timer' %}">Timer</a>
<a class="text-white/70 hover:text-white transition-colors" href="{% url 'focusai:to-do' %}">To Do List</a>
<a class="text-white/70 hover:text-white transition-colors" href="{% url 'focusai:summarization' %}">Summarization</a>
</nav>
<div class="hidden md:flex items-center gap-6">
<a class="text-white/70 hover:text-white transition-colors" href="{% url 'focusai:home' %}">Home</a>
<a class="text-white/70 hover:text-white transition-colors" href="{% url 'focusai:contact' %}">Contact Us</a>
</div>
<div class="flex items-center gap-6 md:hidden">
<button class="text-white/70 hover:text-white transition-colors">
<span class="material-symbols-outlined text-3xl">menu</span>
</button>
</div>
</header>
<main class="flex flex-1 flex-col items-center justify-center p-4 pt-24">
<div class="w-full max-w-4xl">
<h2 class="mb-12 text-center text-4xl font-bold tracking-tight">Contact Us</h2>
<div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
<div class="flex flex-col items-center gap-4 rounded-lg bg-white/5 p-8 text-center">
<div class="icon-wrapper text-primary">
<span class="material-symbols-outlined text-5xl">mail</span>
</div>
<h3 class="text-xl font-bold">Email</h3>
<p class="text-sm text-text-main/70">charulabs@gmail.com</p>
</div>
<div class="flex flex-col items-center gap-4 rounded-lg bg-white/5 p-8 text-center">
<div class="icon-wrapper text-primary">
<span class="material-symbols-outlined text-5xl">link</span>
</div>
<h3 class="text-xl font-bold">Linktree</h3>
<p class="text-sm text-text-main/70">https://linktr.ee/charulabs</p>
</div>
<div class="flex flex-col items-center gap-4 rounded-lg bg-white/5 p-8 text-center">
  <div class="icon-wrapper text-primary">
    <span class="material-symbols-outlined text-5xl !text-primary">chat</span>
  </div>
  <h3 class="text-xl font-bold">Discord</h3>
  <p class="text-sm text-text-main/70">charulabs</p>
</div>

<div class="flex flex-col items-center gap-4 rounded-lg bg-white/5 p-8 text-center">
<div class="icon-wrapper text-primary">

</div>
<h3 class="text-xl font-bold">Github</h3>
<p class="text-sm text-text-main/70">github.com/Aruniaaa/Aruniaaa</p>
</div>
<div class="flex flex-col items-center gap-4 rounded-lg bg-white/5 p-8 text-center sm:col-span-2 lg:col-span-2 lg:col-start-2">
  <div class="icon-wrapper text-primary">
      <svg fill="currentColor" height="24" role="img" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><title>DEV Community</title><path d="M7.426 5.154a1.868 1.868 0 0 1 1.868 1.868v10.156a1.868 1.868 0 0 1-3.736 0V7.022a1.868 1.868 0 0 1 1.868-1.868Zm3.856.128h2.32v1.983h.033a4.48 4.48 0 0 1 4.029-1.983c4.314 0 5.112 2.84 5.112 6.533v7.541h-3.737v-6.66c0-1.588-.03-3.628-2.213-3.628-2.21 0-2.55 1.728-2.55 3.512v6.776h-3.73V5.282Z M0 4.995a1.996 1.996 0 0 1 1.996-1.996h.01a1.996 1.996 0 0 1 1.996 1.996v.01A1.996 1.996 0 0 1 1.996 7h-.01A1.996 1.996 0 0 1 0 5v-.005Z"></path></svg>
  </div>
  <h3 class="text-xl font-bold">Dev.to</h3>
  <p class="text-sm text-text-main/70">https://dev.to/charulabs</p>
</div>

</div>
</div>
</main>
</div>
</body></html>
