<!DOCTYPE html>
{% load static %}
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FocusAI Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#ff6b6b",
              "background-dark": "#0f1419",
              "card-bg": "#1a1f2e"
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"]
            }
          },
        },
      };
    </script>
<style>
      body {
        font-family: 'Space Grotesk', sans-serif;
      }
    </style>
</head>
<body class="bg-background-dark font-display text-white">
<div class="relative min-h-screen w-full">
<div class="relative z-10 flex h-full grow flex-col">
<header class="flex items-center justify-between px-10 py-6">
<div class="flex items-center gap-3">
<div class="h-10 w-10 rounded-lg flex items-center justify-center">
<img src="{% static 'assets/vinca.png' %}" class="h-10 w-10" alt="vinca" />
</div>
<h2 class="text-2xl font-bold">FocusAI</h2>
</div>
<div class="flex items-center gap-6">
<a class="text-white/70 hover:text-white transition-colors text-sm" href="{% url 'focusai:home' %}">Home</a>
</div>
</header>
<main class="flex flex-1 flex-col items-center justify-center px-4 py-20">
<div class="w-full max-w-md">
<h1 class="text-5xl font-bold text-white mb-3">Login</h1>
<p class="text-white/50 text-lg mb-12">Welcome back to FocusAI.</p>
<form action="{% url 'focusai:login' %}" method="POST" class="space-y-5">
    {% csrf_token %}
         {% if message %}
          <p class="text-red-500 text-sm text-center mb-2">{{ message }}</p>
          {% endif %}
<div>
<label class="sr-only" id="email" name="email" for="email">Email</label>
<input class="w-full rounded-lg border-0 bg-card-bg px-5 py-4 text-white placeholder:text-white/40 focus:outline-none focus:ring-2 focus:ring-primary/50" id="email" name="email" placeholder="Email" required="" type="email"/>
</div>
<div>
<label class="sr-only" id="password" name="password" for="password">Password</label>
<input class="w-full rounded-lg border-0 bg-card-bg px-5 py-4 text-white placeholder:text-white/40 focus:outline-none focus:ring-2 focus:ring-primary/50" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<button class="w-full rounded-lg bg-primary py-4 text-lg font-semibold text-white transition-all hover:bg-primary/90 hover:shadow-lg" type="submit">
                        Login
                    </button>
</form>
<div class="mt-10 text-center">
<p class="text-white/50">
                        Don't have an account?
                        <a class="font-medium text-white hover:text-white/80 transition-colors underline" href="{% url 'signup' %}">
                            Sign Up
                        </a>
</p>
</div>
</div>
</main>
</div>
</div>

</body></html>
