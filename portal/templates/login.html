<!DOCTYPE html>
{% load static %}
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - MetaCog OS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#fe7474",
            "secondary": "#c7b7ff",
            "background-dark": "#0D0F14",
            "tv-pink": "#fe7474",
            "tv-blue": "#c7b7ff",
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
    }
    .icon-sm {
      font-size: 20px;
    }
    .icon-md {
      font-size: 28px;
    }
    .icon-lg {
        font-size: 40px;
    }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #1E2129 inset !important;
        -webkit-text-fill-color: #ffffff !important;
        caret-color: #ffffff;
    }
  </style>
</head>
<body class="bg-background-dark text-white font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<header class="w-full">
    <nav class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 grid grid-cols-2 items-center gap-4">
        <!-- LEFT: Fixed position logo -->
        <div class="flex items-center gap-2">
            <img src="{% static 'assets/iris.png' %}" class="h-8 w-8" alt="iris" />
            <a href="{% url 'portal:home' %}">
                <span class="font-bold text-lg whitespace-nowrap">MetaCog<span class="text-slate-400"> OS</span></span>
            </a>
        </div>



    </nav>
    <div class="w-full border-b border-white/10"></div>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-4 sm:px-6 lg:px-8 py-16 sm:py-24">
<div class="layout-content-container flex flex-col w-full max-w-md mx-auto items-center gap-8">
<div class="flex flex-col items-center text-center gap-4">
<h1 class="text-white tracking-tighter text-4xl sm:text-5xl font-bold leading-tight">Log In to MetaCog OS</h1>
<p class="text-slate-300 text-lg max-w-2xl font-medium">Continue your cognitive discipline and training.</p>
</div>
      {% if message %}
        <div class="mb-6 p-4 rounded-md bg-red-500/10 border border-red-500/20">
          <p class="text-sm text-red-400 text-center">{{ message }}</p>
        </div>
        {% endif %}
<form action="{% url 'portal:login' %}" method="POST" class="w-full flex flex-col gap-6">
    {% csrf_token %}
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-300" for="email">Email</label>
<input name="email" class="w-full h-12 px-4 bg-[#1E2129] border border-white/10 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-tv-pink focus:border-tv-pink transition-colors" id="email" placeholder="you@example.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-medium text-slate-300" for="password">Password</label>
<input name="password" class="w-full h-12 px-4 bg-[#1E2129] border border-white/10 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-tv-pink focus:border-tv-pink transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full flex items-center justify-center h-12 px-6 bg-tv-pink text-background-dark text-base font-bold rounded-lg hover:bg-opacity-90 transition-colors focus:outline-none focus:ring-2 focus:ring-tv-pink focus:ring-offset-2 focus:ring-offset-background-dark" type="submit">Log In</button>
</form>
<div class="text-center">
<p class="text-slate-400">Don't have an account yet? <a class="text-tv-blue hover:text-white transition-colors font-medium" href="{% url 'portal:signup' %}">Sign Up</a></p>
</div>
</div>
</main>
<footer class="flex flex-col gap-6 px-5 py-8 text-center w-full max-w-4xl mx-auto border-t border-white/10">
<p class="text-slate-500 text-sm font-normal leading-normal">Version 1.0.0 © 2025 MetaCog OS</p>
</footer>
</div>
</div>
</body></html>
